[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-tracker"
version = "1.0.0"
description = "CLI application for tracking passenger flight statuses"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
flight-tracker = "flight_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
